<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.22" />
      <stop offset="68%" stop-color="#0d4f24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f6b2f" />
      <stop offset="55%" stop-color="#1db954" />
      <stop offset="88%" stop-color="#169944" />
      <stop offset="100%" stop-color="#0c5c28" />
    </radialGradient>
    <linearGradient id="sheenA" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.45" />
      <stop offset="48%" stop-color="#1db954" stop-opacity="0" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="streak1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#4ade80" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1db954" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="streak2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#4ade80" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1db954" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090b" />
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Outer kinetic spin swooshes -->
  <path
    d="M 300 48 A 212 212 0 0 1 442 154"
    stroke="#4ade80"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />
  <path
    d="M 212 464 A 212 212 0 0 1 70 358"
    stroke="#4ade80"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />

  <!-- Main green vinyl disc -->
  <circle cx="256" cy="256" r="192" fill="url(#vinylGrad)" />
  <circle cx="256" cy="256" r="192" fill="url(#sheenA)" />

  <!-- Track separator grooves -->
  <circle cx="256" cy="256" r="172" stroke="#083d1b" stroke-width="2.5" stroke-opacity="0.55" />
  <circle cx="256" cy="256" r="154" stroke="#083d1b" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="136" stroke="#083d1b" stroke-width="2" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="120" stroke="#083d1b" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="102" stroke="#083d1b" stroke-width="2" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="88" stroke="#083d1b" stroke-width="3.5" stroke-opacity="0.55" />

  <!-- Spinning track motion arcs -->
  <path
    d="M 272 88 A 168 168 0 0 1 402 172"
    stroke="url(#streak1)"
    stroke-width="7.5"
    stroke-linecap="round"
  />
  <path
    d="M 380 326 A 144 144 0 0 1 258 400"
    stroke="url(#streak2)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M 148 308 A 120 120 0 0 1 174 168"
    stroke="url(#streak1)"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <path
    d="M 224 164 A 96 96 0 0 1 312 180"
    stroke="#bbf7d0"
    stroke-width="5"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />

  <!-- Center label -->
  <circle cx="256" cy="256" r="72" fill="#111317" stroke="#072e14" stroke-width="4" />
  <circle cx="256" cy="256" r="64" stroke="#1db954" stroke-width="4" />
  <circle cx="256" cy="256" r="42" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" />
  <path
    d="M 256 202 A 54 54 0 0 1 300 225"
    stroke="#86efac"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />

  <!-- Spindle hole -->
  <circle cx="256" cy="256" r="22" fill="#27362e" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="16" fill="#09090b" />
</svg>
